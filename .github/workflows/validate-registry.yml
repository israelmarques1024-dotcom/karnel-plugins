name: Validate Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema, source, manifest and commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: israelmarques1024-dotcom/karnel-termux
          ref: d78706099cdad744ddd96e19466593ef9624f0b0 # v4.13.7
          path: karnel-termux
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install static validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.18,<5"
      - name: Verify Python validation dependency
        run: python -c "import jsonschema; print(jsonschema.__version__)"
      - name: Validate JSON files
        run: jq empty registry.json schemas/*.json
      - name: Validate approved registry entries
        run: >-
          python3 scripts/validate_registry.py --require-shellcheck
          --local-repository israelmarques1024-dotcom/karnel-plugins
          --native-commands-dir karnel-termux/karnel/cli/commands
